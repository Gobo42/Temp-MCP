[package]
name = "tapo-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tapo = "=0.11.1"
tokio = { version = "1", features = ["macros", "rt", "time", "signal"] }
